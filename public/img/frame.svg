<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" shape-rendering="crispEdges">
  <!-- JRPG window frame, 9-slice at 6px: dark outline, white bevel, dark inner line, notched corners. -->
  <g fill="#0a0b26">
    <rect x="2" y="0" width="14" height="1"/><rect x="2" y="17" width="14" height="1"/>
    <rect x="0" y="2" width="1" height="14"/><rect x="17" y="2" width="1" height="14"/>
    <rect x="1" y="1" width="1" height="1"/><rect x="16" y="1" width="1" height="1"/>
    <rect x="1" y="16" width="1" height="1"/><rect x="16" y="16" width="1" height="1"/>
  </g>
  <g fill="#f4f2ff">
    <rect x="2" y="1" width="14" height="2"/><rect x="2" y="15" width="14" height="2"/>
    <rect x="1" y="2" width="2" height="14"/><rect x="15" y="2" width="2" height="14"/>
  </g>
  <g fill="#b9b4e0">
    <rect x="3" y="14" width="12" height="1"/><rect x="14" y="3" width="1" height="12"/>
  </g>
  <g fill="#0a0b26">
    <rect x="3" y="3" width="11" height="1"/><rect x="3" y="3" width="1" height="11"/>
  </g>
</svg>
